<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
<title id="title">From a question to an answer grounded in company data</title><desc id="desc">A user question goes through tool calls and SQL to a database, then an LLM produces an answer streamed to the interface. Supporting capabilities include memory, caching, parallel requests, and shared chats.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#51e5d2"/></marker></defs>
<rect width="1200" height="240" rx="16" fill="#0d1625"/>
<text x="32" y="37" fill="#9eb3cb" font-family="monospace" font-size="14" letter-spacing="2">THE KIND OF SYSTEMS I BUILD</text>
<g fill="#142338" stroke="#31455e">
<rect x="32" y="67" width="192" height="84" rx="10"/><rect x="266" y="67" width="192" height="84" rx="10"/><rect x="500" y="67" width="192" height="84" rx="10"/><rect x="734" y="67" width="192" height="84" rx="10"/><rect x="968" y="67" width="200" height="84" rx="10" stroke="#c5f277"/>
</g>
<g stroke="#51e5d2" stroke-width="2" marker-end="url(#arrow)"><path d="M232 109H255"/><path d="M466 109H489"/><path d="M700 109H723"/><path d="M934 109H957"/></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#f0f5fc" text-anchor="middle">
<text x="128" y="104">Ask a question</text><text x="362" y="104">Tool calls + SQL</text><text x="596" y="104">Query the data</text><text x="830" y="104">LLM response</text><text x="1068" y="104" fill="#d2f69d">Stream the answer</text>
</g>
<g font-family="monospace" font-size="13" fill="#a8bbcf" text-anchor="middle"><text x="128" y="129">natural language</text><text x="362" y="129">orchestration</text><text x="596" y="129">company database</text><text x="830" y="129">grounded in results</text><text x="1068" y="129">back to the UI</text></g>
<path d="M32 177H1168" stroke="#26384d"/><text x="600" y="211" text-anchor="middle" fill="#a8bbcf" font-family="monospace" font-size="16">MEMORY  /  CACHING  /  PARALLEL REQUESTS  /  SHARED CHATS</text>
</svg>