<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">The toolkit</title><desc id="desc">Application development: JavaScript, Python, Node.js, React, Express, PostgreSQL. AI engineering: OpenAI and Anthropic SDKs, tool orchestration, memory, streaming, caching, and concurrency. Development tools: Claude, Codex, Cursor, and Grok CLI.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1221"/><stop offset="1" stop-color="#111e31"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bb3cc" stroke-opacity=".04"/></pattern></defs><rect x="1" y="1" width="958" height="398" rx="18" fill="url(#bg)" stroke="#293b51"/><rect x="1" y="1" width="958" height="398" rx="18" fill="url(#grid)"/><text x="40" y="44" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">02 / THE TOOLKIT</text><text x="40" y="100" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#f4f8fc">Across the stack.</text><path d="M467 135V269" stroke="#2b4058"/><text x="40" y="155" font-family="monospace" font-size="18" font-weight="500" fill="#c5f277">APPLICATIONS</text><text x="40" y="197" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">JavaScript / Python / Node.js</text><text x="40" y="233" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">React / Express / PostgreSQL</text><text x="500" y="155" font-family="monospace" font-size="18" font-weight="500" fill="#c5f277">AI ENGINEERING</text><text x="500" y="197" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">OpenAI + Anthropic SDKs</text><text x="500" y="233" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">Tools / Memory / Streaming</text><text x="500" y="269" font-fami