<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1860" viewBox="0 0 960 1860" role="img" aria-labelledby="title desc"><title id="title">Josh Brown. Father. Engineer. Builder.</title><desc id="desc">Josh Brown. Father, software engineer, and builder based in Denver. Full stack. Real data. Practical AI. I build full stack applications and practical AI tools. At Insurate, I build AI tools for underwriting, including web research, account insights, and an internal AI harness. Capabilities include tool orchestration, conversational memory, streaming, shared chats, caching, parallel AI requests, and OpenAI and Anthropic integrations. I built a dedicated testing portal connected to a development environment without touching live data. Previously at Fortress Information Security, I built APIs and full stack applications using Node.js, Python, PostgreSQL, React, and Express, and maintained an internal portal integrating VirusTotal APIs to support analysis of new software releases. Application development: JavaScript, Python, Node.js, React, Express, PostgreSQL. AI engineering: OpenAI and Anthropic SDKs, tool orchestration, memory, streaming, caching, and concurrency. Development tools: Claude, Codex, Cursor, and Grok CLI. Earlier builds. ClayPal, a collaborative clay sports score-tracking app with dashboards and leaderboards. Open the repository. Insomnia-Thai, a collaborative restaurant application with accounts, reservations, takeout orders, and email confirmations. Open the repository.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1221" /><stop offset="1" stop-color="#111e31" /></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bb3cc" stroke-opacity=".04" /></pattern></defs><rect x="1" y="1" width="958" height="1858" rx="18" fill="url(#bg)" stroke="#293b51" /><rect x="1" y="1" width="958" height="1858" rx="18" fill="url(#grid)" /><g transform="translate(0 0)"><text x="40" y="44" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">BROWNIES-SE / DENVER, CO</text><path d="M0 297 88 241 133 268 216 195 288 274 363 236 463 324 545 262 618 302 705 223 790 294 876 186 960 248" fill="none" stroke="#51e5d2" stroke-opacity=".14" stroke-width="2" /><text x="38" y="136" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="800" fill="#f4f8fc">Josh Brown</text><text x="490" y="136" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="800" fill="#c5f277">.</text><text x="42" y="188" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="600" fill="#d4e3f3">Father. Engineer. Builder.</text><text x="42" y="234" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="600" fill="#c5f277">Full stack. Real data. Practical AI.</text><text x="42" y="280" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#aebfd2">I build full stack applications and practical AI tools.</text><text x="778" y="45" font-family="monospace" font-size="14" font-weight="400" fill="#91a8c2">josh / profile</text></g><path d="M40 360H920" stroke="#293b51" /><g transform="translate(0 360)"><text x="40" y="44" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">01 / WHAT I BUILD</text><text x="40" y="101" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#f4f8fc">AI tools and the harness behind them.</text><text x="40" y="153" font-family="monospace" font-size="20" font-weight="600" fill="#c5f277">INSURATE</text><text x="40" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#aebfd2">AI applications for underwriters: web research,</text><text x="40" y="233" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#aebfd2">account insights, and an internal AI harness.</text><rect x="40" y="265" width="204" height="44" rx="10" fill="#15293a" stroke="#315065" /><text x="56" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Tool orchestration</text><rect x="258" y="265" width="182" height="44" rx="10" fill="#15293a" stroke="#315065" /><text x="274" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Memory + context</text><rect x="454" y="265" width="164" height="44" rx="10" fill="#15293a" stroke="#315065" /><text x="470" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Streaming</text><rect x="632" y="265" width="288" height="44" rx="10" fill="#15293a" stroke="#315065" /><text x="648" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Caching + parallel requests</text><text x="40" y="353" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">OpenAI + Anthropic SDKs. Shared conversations.</text><text x="40" y="397" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">A dedicated dev testing portal for AI tools,</text><text x="40" y="432" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">without touching live data.</text><path d="M40 467H920" stroke="#2b4058" /><text x="40" y="510" font-family="monospace" font-size="20" font-weight="600" fill="#c5f277">FORTRESS INFORMATION SECURITY</text><text x="40" y="553" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">Full stack applications, APIs, and an internal portal</text><text x="40" y="588" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">integrating VirusTotal for software release analysis.</text><text x="40" y="645" font-family="monospace" font-size="23" font-weight="500" fill="#d9e6f3">Node.js / Python / PostgreSQL / React / Express</text><text x="40" y="702" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#91a8c2">From security teams to insurance underwriting.</text></g><path d="M40 1100H920" stroke="#293b51" /><g transform="translate(0 1100)"><text x="40" y="44" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">02 / THE TOOLKIT</text><text x="40" y="100" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#f4f8fc">Across the stack.</text><path d="M467 135V269" stroke="#2b4058" /><text x="40" y="155" font-family="monospace" font-size="18" font-weight="500" fill="#c5f277">APPLICATIONS</text><text x="40" y="197" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">JavaScript / Python / Node.js</text><text x="40" y="233" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">React / Express / PostgreSQL</text><text x="500" y="155" font-family="monospace" font-size="18" font-weight="500" fill="#c5f277">AI ENGINEERING</text><text x="500" y="197" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">OpenAI + Anthropic SDKs</text><text x="500" y="233" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">Tools / Memory / Streaming</text><text x="500" y="269" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#d9e6f3">Caching / Concurrency</text><path d="M40 301H920" stroke="#2b4058" /><text x="40" y="337" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">IN MY EDITOR + TERMINAL</text><text x="40" y="375" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#f0f5fc">Claude / Codex / Cursor / Grok CLI</text></g><path d="M40 1500H920" stroke="#293b51" /><g transform="translate(0 1500)"><text x="40" y="39" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">03 / EARLIER BUILDS</text><text x="40" y="91" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#f4f8fc">ClayPal</text><text x="40" y="134" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#aebfd2">Clay sports score tracking, dashboards, and leaderboards.</text><text x="40" y="167" font-family="monospace" font-size="17" fill="#72ebdb">github.com/TJCourey/ClayPal</text></g><path d="M40 1680H920" stroke="#293b51" /><g transform="translate(0 1680)"><text x="40" y="39" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">COLLABORATIVE FULL STACK APPLICATION</text><text x="40" y="91" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#f4f8fc">Insomnia-Thai</text><text x="40" y="134" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#aebfd2">Accounts, reservations, takeout orders, and email confirmations.</text><text x="40" y="167" font-family="monospace" font-size="17" fill="#72ebdb">github.com/Brownies-SE/Insomnia-Thai</text></g></svg>