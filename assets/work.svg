<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc"><title id="title">What I build</title><desc id="desc">At Insurate, I build AI tools for underwriting, including web research, account insights, and an internal AI harness. Capabilities include tool orchestration, conversational memory, streaming, shared chats, caching, parallel AI requests, and OpenAI and Anthropic integrations. I built a dedicated testing portal connected to a development environment without touching live data. Previously at Fortress Information Security, I built APIs and full stack applications using Node.js, Python, PostgreSQL, React, and Express, and maintained an internal portal integrating VirusTotal APIs to support analysis of new software releases.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1221"/><stop offset="1" stop-color="#111e31"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bb3cc" stroke-opacity=".04"/></pattern></defs><rect x="1" y="1" width="958" height="738" rx="18" fill="url(#bg)" stroke="#293b51"/><rect x="1" y="1" width="958" height="738" rx="18" fill="url(#grid)"/><text x="40" y="44" font-family="monospace" font-size="17" font-weight="400" fill="#72ebdb">01 / WHAT I BUILD</text><text x="40" y="101" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#f4f8fc">AI tools and the harness behind them.</text><text x="40" y="153" font-family="monospace" font-size="20" font-weight="600" fill="#c5f277">INSURATE</text><text x="40" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#aebfd2">AI applications for underwriters: web research,</text><text x="40" y="233" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#aebfd2">account insights, and an internal AI harness.</text><rect x="40" y="265" width="204" height="44" rx="10" fill="#15293a" stroke="#315065"/><text x="56" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Tool orchestration</text><rect x="258" y="265" width="182" height="44" rx="10" fill="#15293a" stroke="#315065"/><text x="274" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Memory + context</text><rect x="454" y="265" width="164" height="44" rx="10" fill="#15293a" stroke="#315065"/><text x="470" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Streaming</text><rect x="632" y="265" width="288" height="44" rx="10" fill="#15293a" stroke="#315065"/><text x="648" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#d6e6f2">Caching + parallel requests</text><text x="40" y="353" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">OpenAI + Anthropic SDKs. Shared conversations.</text><text x="40" y="397" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">A dedicated dev testing portal for AI tools,</text><text x="40" y="432" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">without touching live data.</text><path d="M40 467H920" stroke="#2b4058"/><text x="40" y="510" font-family="monospace" font-size="20" font-weight="600" fill="#c5f277">FORTRESS INFORMATION SECURITY</text><text x="40" y="553" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">Full stack applications, APIs, and an internal portal</text><text x="40" y="588" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#aebfd2">integrating VirusTotal for software release analysis.</text><text x="40" y="645" font-family="monospace" font-size="23" font-weight="500" fill="#d9e6f3">Node.js / Python / PostgreSQL / React / Express</text><text x="40" y="702" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#91a8c2">From security teams to insurance underwriting.</text></svg>